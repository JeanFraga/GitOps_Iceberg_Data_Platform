covers = ["CAP-2", "CAP-3", "CAP-5"]
after = [{ epic = 1, needs = "Bronze smoke gate passed (whole-epic gate), fingerprint.py, lifecycle.yaml, buckets, catalog, run-identity stub" }, { epic = 2, needs = "committed samples" }]

[[epic]]
id = 4
slug = "epic-silver-normalization"
