# Epics of initiative-healthcare-dv-platform-upgrade, in build order.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "Platform baseline, migration, config contract and guardrails"
covers = ["CAP-14", "CAP-16"]

[[epic]]
id = 2
slug = "epic-synthetic-data"
title = "Synthetic healthcare data generator"
covers = ["CAP-1"]
after = [{ epic = 1, needs = "config loader, region, landing bucket, synthetic-marker rule, mpi_eval DDL, bytes caps" }]

[[epic]]
id = 3
