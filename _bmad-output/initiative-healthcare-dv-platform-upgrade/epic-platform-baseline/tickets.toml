# Entries of epic-platform-baseline (epic 1), in build order.

[[entry]]
id = 1
type = "story"
title = "Clean main and thread demo profile to a first apply"
description = "Runs git rm on src/composer, src/dbt_project, src/looker_project, src/spark_jobs, gitops/, infra/modules/looker, infra/modules/composer, infra/modules/bq_iceberg and the composer-sync, release and terraform workflows, and strips the Makefile targets that point at them. Checks that the v1 GCP resources, already destroyed on 2026-10-07, are gone while the state bucket stays. Then runs the thinnest config-to-Terraform path: git mv infra/environments/dev infra/environments/demo, config/profiles/demo.yaml with region us-east1, a loader at config/load.py run by `make resolve` that writes config/resolved.yaml (entry 3 extends this loader, it does not create a new one), and the demo environment yamldecodes it and applies the `ops` dataset only, no tables (entry 7 adds them), from the CLI with `terraform apply -auto-approve`. The demo environment pins google and google-beta ~> 5 and Terraform 1.15.8, as entry 2 expects."
verify = "`git ls-remote --tags --heads origin v1` returns a ref. On main, `git ls-files src/composer src/dbt_project src/looker_project src/spark_jobs gitops infra/modules/looker infra/modules/composer infra/modules/bq_iceberg infra/environments/dev .github/workflows/composer-sync.yml .github/workflows/release.yml .github/workflows/terraform.yml` prints nothing. The builder runs `gcloud composer environments list --locations=<v1 region>`, `bq ls` and `gcloud storage ls` and sees no v1 resources, and `gcloud storage ls gs://<tfstate-bucket>` succeeds. After `make resolve`, `terraform apply` in infra/environments/demo creates the `ops` dataset in us-east1, and `grep -rn us-east1 infra/` prints nothing."
covers = ["CAP-14"]
after = []
hitl = false
notes = ["Use cli commands that can auto approve"]
risk = "high"
references = ["architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#migration-from-the-current-repo", "architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-19", "architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-1"]

[[entry]]
id = 2
type = "story"
title = "Step the Google providers 5 to 8.6.0"
description = "Steps google and google-beta from 5 to 6, then 7, then 8.6.0 on infra/environments/demo. At each step the builder runs `terraform plan` from the CLI and records the output in the ticket plan, and a multi-platform .terraform.lock.hcl is committed."
verify = "At 8.6.0, `terraform plan` in infra/environments/demo reports no changes, the plan output of each step is recorded in the ticket, and `terraform providers lock -platform=linux_amd64 -platform=darwin_arm64 -platform=linux_arm64` leaves the committed lockfile unchanged."
covers = ["CAP-14", "CAP-16"]
after = [1]
hitl = false
notes = ["Use cli commands that can auto approve"]
risk = "high"
references = ["architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#migration-from-the-current-repo", "architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-20"]

[[entry]]
