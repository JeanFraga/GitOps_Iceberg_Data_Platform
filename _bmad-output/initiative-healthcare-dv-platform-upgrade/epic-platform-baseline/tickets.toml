title = "Ops, steward and mpi_eval datasets and the warehouse store"
description = "Adds tables to the `ops` dataset resource that entry 1 created (no second declaration), the steward and mpi_eval datasets, with schemas under infra/modules/bq_ops/schemas/*.json, including `ops.run_events` with the Dataproc run counter and `ops.run_lock` (lock_key, run_id, acquired_at, expires_at), used by entry 10's stub. Extends infra/modules/storage with the Iceberg warehouse bucket and adds the BigLake REST catalog, all named from config. The builder applies from the CLI with `terraform apply -auto-approve`."
verify = "After `terraform apply -auto-approve` in infra/environments/demo, `bq show --schema` for every declared table diffs clean against its schemas/*.json file, and the catalog and warehouse bucket exist in us-east1."
