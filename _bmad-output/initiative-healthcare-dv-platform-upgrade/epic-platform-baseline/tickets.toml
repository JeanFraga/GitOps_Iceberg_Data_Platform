[[entry]]
id = 8
type = "story"
title = "Cost guardrails and teardown"
description = "Adds budget alerts at 50%, 90% and 100% of USD 5 on the billing account named in the profile, a bytes-cap lint (`make lint-bytes-cap PROFILE=...`) that fails when a profile has no cap, and `make teardown`, which destroys everything except the state bucket. The builder creates the budget alerts directly with the owner's gcloud credentials (`gcloud billing budgets create ... --quiet`), granting no billing role to any service account, and runs teardown, apply (`-auto-approve`) and the billing check itself."
verify = "`make lint-bytes-cap PROFILE=config/tests/fixtures/no_cap.yaml` exits nonzero, `gcloud billing budgets list` shows the three thresholds, and `make teardown` followed by `make apply` leaves `terraform plan` in infra/environments/demo clean with the state bucket intact."
covers = ["CAP-14"]
after = [4, 7]
hitl = false
notes = ["Use cli commands that can auto approve"]
risk = "medium"
references = ["architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-16"]

[[entry]]
id = 9
type = "story"
title = "FR-35 PHI scan and synthetic-marker check"
description = "Adds the FR-35 scanner and the synthetic-marker check as make targets CI can call, each taking a PATH= argument with a repo-wide default and an allowlist for the fixture dirs, with fixtures in tests/fixtures/phi/{dirty,clean} and tests/fixtures/marker/{marked,unmarked}. The marker format follows AD-14."
verify = "`make phi-scan PATH=tests/fixtures/phi/dirty` fails on the seeded SSN, `make marker-check PATH=tests/fixtures/marker/unmarked` fails, and both pass on the clean and marked fixtures and on the repo default."
covers = ["CAP-14"]
after = [5]
hitl = false
risk = "medium"
references = ["architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-14"]

