[[entry]]
id = 6
type = "story"
title = "Separate service accounts and the landing no-delete rule"
description = "Creates the deploy, runtime and dashboard SAs with no JSON keys in infra/modules/iam and sets up CLI impersonation of the deploy SA. Adds the landing bucket in infra/modules/storage, where the runtime SA can write objects but not delete them, and writes an NFR-9 IAM and bucket-policy review section in the ticket plan file. The builder applies from the CLI with `terraform apply -auto-approve`."
verify = "The builder runs `gcloud storage rm gs://<landing>/probe --impersonate-service-account=<runtime-sa>` and gets 403, `gcloud iam service-accounts keys list --managed-by=user` is empty for all three SAs, and the ticket plan has the NFR-9 section."
covers = ["CAP-14"]
after = [2]
hitl = false
notes = ["Use cli commands that can auto approve"]
risk = "high"
references = ["architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-18", "architecture-healthcare-dv-platform-upgrade/architecture-healthcare-dv-platform-upgrade.md#ad-3"]

[[entry]]
