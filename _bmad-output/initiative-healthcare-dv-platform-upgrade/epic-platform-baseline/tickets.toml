description = "Adds `versions.yaml` for the non-registry pins (Dataproc runtime 3.0, Iceberg 1.12.0, Fusion, and Cosmos 1.15.1 marked inert), a uv Python 3.12 project with its lockfile (pytest, jsonschema), the Makefile skeleton with lint, test, tf-validate and validate targets that later entries append to, and a devcontainer aligned with these pins. Terraform pins stay in required_providers and the lockfile."
