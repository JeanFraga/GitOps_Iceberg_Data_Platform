type = "story"
title = "Config contract schema, template profile and validate-config"
description = "Extends entry 1's loader (config/load.py and the resolved.yaml writer) with JSON Schema validation (flags map with exact keys, additionalProperties false, cost flags off, ml_fallback_enabled on), adds the _template profile, `make validate-config`, and a stale-resolved.yaml check as a make target CI can call."
