name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

# Serialise main applies without letting PR plan runs evict a queued apply
# from the group's single pending slot: PRs get their own group per PR, and
# Terraform state locking guards plan-vs-apply across groups.
concurrency:
  group: terraform-dev-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

# TF_VAR_* are set in the "Resolve Terraform variables" step, not here:
# a workflow-level env entry overrides $GITHUB_ENV in every later step.

defaults:
  run:
    working-directory: infra/environments/dev

jobs:
  terraform:
    name: Terraform Validate → Plan → Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # allow posting plan comment on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Resolve Terraform variables
        env:
          INPUT_PROJECT_ID: ${{ secrets.TF_VAR_PROJECT_ID != '' && secrets.TF_VAR_PROJECT_ID || (secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID) }}
          INPUT_PIPELINE_SA: ${{ secrets.PIPELINE_SERVICE_ACCOUNT }}
        run: |
          project_id="${INPUT_PROJECT_ID:-$GOOGLE_CLOUD_PROJECT}"
          if [ -z "$project_id" ]; then
            echo "TF_VAR_project_id is not set. Configure secrets.TF_VAR_PROJECT_ID, secrets.GCP_PROJECT_ID, vars.GCP_PROJECT_ID, or ensure GCP auth exposes GOOGLE_CLOUD_PROJECT." >&2
            exit 1
          fi
          echo "TF_VAR_project_id=$project_id" >> "$GITHUB_ENV"
          echo "TF_VAR_pipeline_service_account=$INPUT_PIPELINE_SA" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.x"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: TFLint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Terraform Plan
        id: plan
        run: |
          # Without pipefail the exit code comes from tee, hiding plan failures.
          set -o pipefail
          terraform plan \
            -var-file=dev.tfvars \
            -out=tfplan \
            -no-color 2>&1 | tee plan.txt

      - name: Post Plan to PR
        if: always() && github.event_name == 'pull_request' && hashFiles('infra/environments/dev/plan.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/dev/plan.txt', 'utf8');
            const maxLen = 60000;
            const output = plan.length > maxLen ? plan.substring(0, maxLen) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`terraform\n${output}\n\`\`\``
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.plan.outcome == 'success'
        run: terraform apply -auto-approve tfplan
