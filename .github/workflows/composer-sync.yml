name: Composer Sync

on:
  push:
    branches: [main]
    paths:
      - 'src/composer/**'
      - 'src/dbt_project/**'
      - '.github/workflows/composer-sync.yml'
  workflow_dispatch:

# Only the latest sync matters; cancel superseded runs.
concurrency:
  group: composer-sync
  cancel-in-progress: true

env:
  # Same fallback chain as release.yml / terraform.yml — keep in sync.
  GCP_PROJECT_ID: ${{ secrets.TF_VAR_PROJECT_ID != '' && secrets.TF_VAR_PROJECT_ID || (secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID) }}
  GCP_REGION: us-east1
  # Must match environment_name in infra/modules/composer.
  COMPOSER_ENV: nyc-taxi-composer

jobs:
  sync:
    name: Sync DAGs and dbt project to Composer
    # Dependabot-triggered runs receive no repository secrets; skip instead
    # of failing red (same guard as terraform.yml).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Sync to the Composer bucket
        run: |
          set +e
          DESCRIBE_OUT=$(gcloud composer environments describe "$COMPOSER_ENV" \
            --location "$GCP_REGION" --format='value(config.dagGcsPrefix)' 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # Only a definitively-absent environment is a benign no-op; any
            # other failure (auth, quota, transient) must fail the run.
            if echo "$DESCRIBE_OUT" | grep -qiE 'NOT_FOUND|was not found|does not exist'; then
              echo "::notice::Composer environment ${COMPOSER_ENV} not found (composer_enabled=false?); nothing to sync."
              exit 0
            fi
            echo "$DESCRIBE_OUT" >&2
            exit 1
          fi
          DAG_PREFIX="$DESCRIBE_OUT"
          BUCKET_PATH="${DAG_PREFIX%/dags}"
          echo "Syncing DAGs to ${DAG_PREFIX} and dbt project to ${BUCKET_PATH}/data/dbt_project"
          # airflow_monitoring.py is Composer's own liveness DAG — never delete it.
          gsutil -m rsync -r -d -x '^airflow_monitoring\.py$' \
            src/composer/dags "${DAG_PREFIX}"
          gsutil -m rsync -r -d \
            -x '^(target|dbt_packages|logs)/.*$|^\.user\.yml$' \
            src/dbt_project "${BUCKET_PATH}/data/dbt_project"
