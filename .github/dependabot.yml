version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/src/spark_jobs"
    schedule:
      interval: weekly
    groups:
      spark-deps:
        patterns: ["*"]
    ignore:
      # pyspark must track the Spark version shipped by the pinned Dataproc
      # runtime (DATAPROC_RUNTIME_VERSION in release.yml).
      - dependency-name: "pyspark"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: "/src/dbt_project"
    schedule:
      interval: weekly
    groups:
      dbt-deps:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - "/infra/environments/dev"
      - "/infra/modules/bq_iceberg"
    schedule:
      interval: weekly
    groups:
      terraform-deps:
        patterns: ["*"]
    ignore:
      # Provider major upgrades are deliberate migrations, not auto-bumps.
      # Both forms: update-types misses requirement-style bumps (observed
      # with the ~> 5.0 → ~> 6.50 proposal), so pin the ceiling explicitly.
      - dependency-name: "hashicorp/google"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/google"
        versions: [">= 6"]

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
