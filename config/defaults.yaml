# Shared defaults. Profiles in config/profiles/ are deep-merged over this file
# by config/load.py. Cost-bearing flags default false (AD-1).
flags:
  workflows_enabled: false
  composer_enabled: false
  dataproc_schedule_enabled: false
  ml_fallback_enabled: true
# D-7 (open): data-drift thresholds are unset, so drift is reported, never blocking.
drift:
  data_drift_thresholds: null
  mode: report_only
# AD-16: budget alerts only (no cap enforcement), created by `make budget`.
budget:
  amount_usd: 5
  alert_thresholds: [0.5, 0.9, 1.0]
# AD-17: one pipeline run per client; ops.run_lock expires after this TTL.
run:
  lock_ttl_minutes: 120
# Epic synthetic-data: seeded generator (python -m datagen). Same seed + profile = same bytes.
datagen:
  seed: 20261008
  eval_seed: 20261009
  edge_case_rate: 0.02
  eval_only_scenarios: [twin, cross_payer_switch]
  volume_profile: ci
  schema_drift:
    - {scenario: rename_column, source: payer_b, feed: members, field: dob, to: birth_date}
    - {scenario: add_column, source: payer_a, feed: pharmacy, field: prior_auth_number}
    - {scenario: cast_failure, source: payer_a, feed: pharmacy, field: quantity_dispensed}
    - {scenario: remove_column, source: provider_directory, feed: providers, field: credential}
    - {scenario: date_format, source: emr_facility_1, feed: patient, field: birthDate}
  volume_profiles:
    ci: {records_per_file: 5000, years: 1}
    full: {records_per_file: 30000, years: 2}
