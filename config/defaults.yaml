# Shared defaults. Profiles in config/profiles/ are deep-merged over this file
# by config/load.py. Cost-bearing flags default false (AD-1).
flags:
  workflows_enabled: false
  composer_enabled: false
  dataproc_schedule_enabled: false
  ml_fallback_enabled: true
# D-7 (open): data-drift thresholds are unset, so drift is reported, never blocking.
drift:
  data_drift_thresholds: null
  mode: report_only
