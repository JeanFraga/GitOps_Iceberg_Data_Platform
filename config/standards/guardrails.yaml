# FR-35 PHI scan and AD-14 / NFR-4 synthetic-marker check. Read by tools/guardrails.py.
synthetic_marker:
  # Every generated data file carries this exact token within its first `within_bytes`
  # bytes (a CSV/JSONL header comment or field, an X12 BHT/REF value, a FHIR meta tag).
  token: "SYNTHETIC-DATA-NO-REAL-PHI"
  within_bytes: 4096
  data_extensions: [".csv", ".jsonl", ".ndjson", ".x12", ".edi", ".834", ".835", ".837", ".fhir.json"]
phi_scan:
  # Regexes for PHI-shaped values that must never appear in logs, summaries, ops rows or the repo.
  patterns:
    ssn: '\b\d{3}-\d{2}-\d{4}\b'
  # Full names emitted by the generator; datagen (E2) appends them here or passes --names.
  names: []
  max_file_bytes: 5000000
# FR-37 repo-weight guard and `make samples` size. Read by tools/guardrails.py and datagen.
repo_weight:
  sample_records: 1000  # records_per_file of the committed datagen/samples/ run; max records per data file elsewhere
  max_bytes: 1048576    # max bytes per committed data file outside datagen/samples/
# Repo-wide default runs skip these (fixtures are seeded on purpose; tooling is vendored).
allowlist:
  - tests/fixtures/
  - _bmad/
  - _bmad-output/
  - .agents/
  - .claude/
  # Committed synthetic samples: PHI scanning targets logs/summaries only. marker-check still covers them.
  - datagen/samples/
