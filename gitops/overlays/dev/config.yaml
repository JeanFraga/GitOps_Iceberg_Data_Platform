apiVersion: v1
kind: ConfigMap
metadata:
  name: data-platform-config
  namespace: data-platform-dev
  labels:
    environment: dev
data:
  GCP_REGION: "us-east1"
  BQ_DATASET: "gold_star_schema"
  ICEBERG_CATALOG: "gcs_catalog"
  BRONZE_TABLE: "gcs_catalog.bronze.yellow_trips"
  SILVER_TABLE: "gcs_catalog.silver.yellow_trips"
  RETAIN_SNAPSHOTS: "5"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-platform-sa
  namespace: data-platform-dev
  annotations:
    # Workload Identity binding – replace <PROJECT_ID> and <K8S_SA>
    iam.gke.io/gcp-service-account: "data-platform@<PROJECT_ID>.iam.gserviceaccount.com"
