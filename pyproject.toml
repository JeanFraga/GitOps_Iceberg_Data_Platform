[project]
name = "gitops-iceberg-data-platform"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "jsonschema==4.25.1",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["_bmad", "_bmad-output", ".agents", ".claude"]

[tool.pytest.ini_options]
testpaths = ["config"]
